{{- $pipelineSize := int (default 1 .Values.api.vllm.pipelineParallelSize) }}
{{- $dataParallelSize := int (default 1 .Values.api.dataParallelSize) }}
{{- if and .Values.worker.enabled (gt $pipelineSize 1) }}
{{- $workerReplicasPerReplica := sub $pipelineSize 1 }}
{{- $workerReplicas := mul $workerReplicasPerReplica $dataParallelSize }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vllm-ray.fullname" . }}-worker
  labels:
    {{- include "vllm-ray.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ $workerReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "vllm-ray.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- $nodeSelector := include "vllm-ray.nodeSelector" (dict "component" .Values.worker "defaultPool" "gpu" "nodePools" .Values.nodePools) }}
      {{- if $nodeSelector }}
      nodeSelector:
{{ $nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.worker.tolerations }}
      tolerations:
        {{- toYaml .Values.worker.tolerations | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ .Values.worker.image.repository }}:{{ .Values.versions.vllmOpenAI }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
          args:
            - |
{{ include "vllm-ray.workerCommand" . | nindent 14 }}
          {{- if .Values.worker.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.worker.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.worker.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.worker.livenessProbe | nindent 12 }}
          {{- end }}
          {{- $gpuCount := int (default 1 .Values.api.vllm.tensorParallelSize) }}
          {{- $resources := deepCopy (default dict .Values.worker.resources) }}
          {{- if not ($resources.requests) }}
          {{- $_ := set $resources "requests" dict }}
          {{- end }}
          {{- if not ($resources.limits) }}
          {{- $_ := set $resources "limits" dict }}
          {{- end }}
          {{- $_ := set $resources.requests "nvidia.com/gpu" $gpuCount }}
          {{- $_ := set $resources.limits "nvidia.com/gpu" $gpuCount }}
          resources:
            {{- toYaml $resources | nindent 12 }}
          {{- if .Values.worker.volumeMounts }}
          volumeMounts:
            {{- toYaml .Values.worker.volumeMounts | nindent 12 }}
          {{- end }}
      {{- if .Values.worker.volumes }}
      volumes:
        {{- toYaml .Values.worker.volumes | nindent 8 }}
      {{- else }}
      volumes:
        - name: hf-cache
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            {{- if .Values.sharedMemory.worker.sizeLimit }}
            sizeLimit: {{ .Values.sharedMemory.worker.sizeLimit }}
            {{- end }}
        - name: blob-models
          persistentVolumeClaim:
            claimName: {{ .Values.global.modelStorage.pvcName }}
      {{- end }}
{{- end }}
