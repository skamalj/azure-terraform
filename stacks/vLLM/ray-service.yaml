# https://docs.ray.io/en/latest/serve/api/doc/ray.serve.llm.LLMConfig.html#ray.serve.llm.LLMConfig
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: ray-serve-llm
spec:
  serveConfigV2: |
    applications:
    - name: llms
      import_path: ray.serve.llm:build_openai_app
      route_prefix: "/"
      args:
        llm_configs:
        - model_loading_config:
            model_id: qwen3thinking
            model_source: /models/cpatonn/Qwen3-30B-A3B-Thinking-2507-AWQ-4bit/
          engine_kwargs:
            max_model_len: 32768
            device: auto
            gpu_memory_utilization: 0.9
            tensor_parallel_size: 1 
            swap_space: 25
            max-num-seqs: 64
          deployment_config:
            num_replicas: 1
            max_ongoing_requests: 32
          resources_per_bundle:
            CPU: 16
            GPU: 1
  rayClusterConfig:
    rayVersion: "2.51.1"
    headGroupSpec:
      rayStartParams:
        num-cpus: "0"
        num-gpus: "0"
      template:
        spec:
          volumes:
          - name: models-storage-volume
            persistentVolumeClaim:
              claimName: s3-models-pvc
          containers:
          - name: ray-head
            image: rayproject/ray-llm:2.51.1-py311-cu128
            volumeMounts:
            - name: models-storage-volume
              mountPath: /models
            ports:
            - containerPort: 8000
              name: serve
              protocol: TCP
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 6379
              name: gcs
              protocol: TCP
            - containerPort: 8265
              name: dashboard
              protocol: TCP
            - containerPort: 10001
              name: client
              protocol: TCP
            resources:
              limits:
                cpu: 3
                memory: 6000M
              requests:
                cpu: 3
                memory: 6000M
    workerGroupSpecs:
    - replicas: 0
      minReplicas: 0
      maxReplicas: 3
      groupName: gpu-group
      rayStartParams:
        num-gpus: "1"
        num-cpus: "16"
      template:
        spec:
          nodeSelector:
            karpenter.sh/nodepool: gpu-pool-h100
          tolerations:
            - key: "nvidia.com/gpu"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"
          volumes:
          - name: models-storage-volume
            persistentVolumeClaim:
              claimName: azure-blob-model-pvc
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 100Gi
          containers:
          - name: ray-worker
            image: rayproject/ray-llm:2.51.1-py311-cu128
            volumeMounts:
            - name: models-storage-volume
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
            resources:
              limits:
                cpu: 20
                memory: 150Gi
                nvidia.com/gpu: "1"
              requests:
                cpu: 20
                memory: 150Gi
                nvidia.com/gpu: "1"

