# https://docs.ray.io/en/latest/serve/api/doc/ray.serve.llm.LLMConfig.html#ray.serve.llm.LLMConfig
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: ray-serve-llm
  annotations:
    ray.io/initializing-timeout: "30m"
spec:
  serveConfigV2: |
    applications:
    - name: llms
      import_path: ray.serve.llm:build_openai_app
      route_prefix: "/"
      args:
        llm_configs:
        - model_loading_config:
            model_id: "qwen25"
            model_source: "/models/Qwen3-30B-A3B-Thinking-2507-AWQ-4bit"
          engine_kwargs:
            gpu_memory_utilization: 0.95
            tensor_parallel_size: 1 
            dtype: "half"
            swap_space: 75
            max_model_len: 32768
            max_num_seqs: 8
            disable_log_stats: false
            trust_remote_code: true
          log_engine_metrics: true
          deployment_config:
            max_ongoing_requests: 11
            autoscaling_config:
              min_replicas: 0
              max_replicas: 8
              target_ongoing_requests: 3
              downscale_to_zero_delay_s: 900
              downscale_delay_s : 600
              look_back_period_s: 60
            ray_actor_options:
              num_cpus: 16
  rayClusterConfig:
    rayVersion: "2.50.1"
    enableInTreeAutoscaling: true
    autoscalerOptions:
      version: v2
      idleTimeoutSeconds: 600
      env:
        - name: RAY_AUTOSCALER_RECONCILE_ALLOCATE_STATUS_TIMEOUT_S
          value: "1200" 
    headGroupSpec:
      rayStartParams:
        num-cpus: "2"
        num-gpus: "0"
        metrics-export-port: "8080"
      template:
        spec:
          nodeSelector:
            karpenter.sh/nodepool: cpu-pool
          volumes:
          - name: models-storage-volume
            persistentVolumeClaim:
              claimName: azure-blob-model-pvc
          containers:
          - name: ray-head
            image:  rayproject/ray-llm:2.50.1-py311-cu128
            volumeMounts:
            - name: models-storage-volume
              mountPath: /models
            env:
              - name: RAY_AUTOSCALER_RECONCILE_ALLOCATE_STATUS_TIMEOUT_S
                value: "1200"
              - name: RAY_GRAFANA_IFRAME_HOST
                value: http://127.0.0.1:3000
              - name: RAY_GRAFANA_HOST
                value: http://prometheus-grafana.prometheus-system.svc:80
              - name: RAY_PROMETHEUS_HOST
                value: http://prometheus-kube-prometheus-prometheus.prometheus-system.svc:9090
            ports:
            - containerPort: 8000
              name: serve
              protocol: TCP
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 6379
              name: gcs
              protocol: TCP
            - containerPort: 8265
              name: dashboard
              protocol: TCP
            - containerPort: 10001
              name: client
              protocol: TCP
            resources:
              limits:
                cpu: 4
              requests:
                cpu: 4
    workerGroupSpecs:
    - replicas: 0
      minReplicas: 0
      maxReplicas: 1
      groupName: gpu-group
      rayStartParams:
        num-gpus: "1"
        num-cpus: "20"
      template:
        spec:
          nodeSelector:
            karpenter.sh/nodepool: gpu-pool-a100
          tolerations:
            - key: "nvidia.com/gpu"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"
            - effect: NoExecute
              key: node.kubernetes.io/not-ready
              operator: Exists
              tolerationSeconds: 1800   # 30 minutes
            - effect: NoExecute
              key: node.kubernetes.io/unreachable
              operator: Exists
              tolerationSeconds: 1800
          volumes:
          - name: models-storage-volume
            persistentVolumeClaim:
              claimName: azure-blob-model-pvc
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 100Gi
          containers:
          - name: ray-worker
            image:  rayproject/ray-llm:2.50.1-py311-cu128
            env:
              - name: VLLM_PROMETHEUS_ENABLED
                value: "true"
              - name: VLLM_PROMETHEUS_PORT
                value: "8001"
              - name: RAY_AUTOSCALER_RECONCILE_ALLOCATE_STATUS_TIMEOUT_S
                value: "1200"
            ports:
              - containerPort: 8001
                name: vllm-metrics
                protocol: TCP
            # Startup probe - allows up to 15 minutes for initial startup
            startupProbe:
              exec:
                command:
                  - bash
                  - -c
                  - wget --tries 1 -T 2 -q -O- http://localhost:52365/api/local_raylet_healthz | grep success
              initialDelaySeconds: 60
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 30  # 60s + (30 × 30s) = 15.5 minutes total
              successThreshold: 1
            volumeMounts:
            - name: models-storage-volume
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
            resources:
              limits:
                cpu: 20
                memory: 150Gi
                nvidia.com/gpu: "1"
              requests:
                cpu: 20
                memory: 150Gi
                nvidia.com/gpu: "1"
    - replicas: 0
      minReplicas: 0
      maxReplicas: 5
      groupName: gpu-group-2
      rayStartParams:
        num-gpus: "1"
        num-cpus: "20"
      template:
        spec:
          nodeSelector:
            karpenter.sh/nodepool: gpu-pool-h100
          tolerations:
            - key: "nvidia.com/gpu"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"
            - effect: NoExecute
              key: node.kubernetes.io/not-ready
              operator: Exists
              tolerationSeconds: 1800   # 30 minutes
            - effect: NoExecute
              key: node.kubernetes.io/unreachable
              operator: Exists
              tolerationSeconds: 1800
          volumes:
          - name: models-storage-volume
            persistentVolumeClaim:
              claimName: azure-blob-model-pvc
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 100Gi
          containers:
          - name: ray-worker
            image:  rayproject/ray-llm:2.50.1-py311-cu128
            env:
              - name: VLLM_PROMETHEUS_ENABLED
                value: "true"
              - name: VLLM_PROMETHEUS_PORT
                value: "8001"
              - name: RAY_AUTOSCALER_RECONCILE_ALLOCATE_STATUS_TIMEOUT_S
                value: "1200"
            ports:
              - containerPort: 8001
                name: vllm-metrics
                protocol: TCP
            volumeMounts:
            - name: models-storage-volume
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
            # Startup probe - allows up to 15 minutes for initial startup
            startupProbe:
              exec:
                command:
                  - bash
                  - -c
                  - wget --tries 1 -T 2 -q -O- http://localhost:52365/api/local_raylet_healthz | grep success
              initialDelaySeconds: 60
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 30  # 60s + (30 × 30s) = 15.5 minutes total
              successThreshold: 1
            resources:
              limits:
                cpu: 20
                memory: 150Gi
                nvidia.com/gpu: "1"
              requests:
                cpu: 20
                memory: 150Gi
                nvidia.com/gpu: "1"